<!doctype html>
<html lang="uk">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Короткі посилання</title></head>
<body>
<header><a href="{% url 'home' %}">Короткі посилання</a>
{% if user.is_authenticated %}
<a href="{% url 'link_list' %}">Мої посилання</a> <a href="{% url 'link_create' %}">Створити</a>
<form method="post" action="{% url 'logout' %}" style="display:inline">{% csrf_token %}<button type="submit">Вийти</button></form>
{% else %}<a href="{% url 'login' %}">Увійти</a> <a href="{% url 'register' %}">Реєстрація</a>{% endif %}
</header><main>{% block content %}{% endblock %}</main>
</body></html>
